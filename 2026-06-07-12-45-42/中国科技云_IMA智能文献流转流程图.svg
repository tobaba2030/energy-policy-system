  <text x="340" y="382" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, sans-serif" font-size="9">单篇导入耗时</text>

  <line x1="410" y1="355" x2="410" y2="395" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Stat 4 -->
  <text x="470" y="365" text-anchor="middle" fill="#f0f4f8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">50+</text>
  <text x="470" y="382" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, sans-serif" font-size="9">引用格式标准</text>

  <line x1="530" y1="355" x2="530" y2="395" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Stat 5 -->
  <text x="585" y="365" text-anchor="middle" fill="#f0f4f8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">24/7</text>
  <text x="585" y="382" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, sans-serif" font-size="9">全自动运行</text>

  <!-- ========== BOTTOM QUOTE ========== -->
  <text x="340" y="445" text-anchor="middle" fill="#C9A96E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">真正的效率提升不是单点工具，而是全流程自动化</text>

