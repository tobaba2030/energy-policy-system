    <line x1="82" y1="54" x2="98" y2="70" stroke="#4a90d9" stroke-width="0.6"/>
    <line x1="98" y1="54" x2="82" y2="70" stroke="#4a90d9" stroke-width="0.6"/>
    <line x1="90" y1="52" x2="90" y2="72" stroke="#4a90d9" stroke-width="0.6"/>
    <line x1="80" y1="62" x2="100" y2="62" stroke="#4a90d9" stroke-width="0.6"/>
    <circle cx="90" cy="62" r="2.5" fill="#4a90d9"/>

    <text x="90" y="100" text-anchor="middle" fill="#a0b4d0" font-family="system-ui, sans-serif" font-size="10">中国科技云学术智能体</text>

    <!-- Data points -->
    <g transform="translate(12, 112)">
      <rect x="0" y="0" width="156" height="28" rx="3" fill="#0a1628" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="8" y="12" fill="#C9A96E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">1000+ 数据源</text>
      <text x="8" y="23" fill="#6a7a98" font-family="system-ui, sans-serif" font-size="9">期刊/论文/专利/报告</text>
