    <rect x="0" y="0" width="180" height="32" rx="4" fill="url(#headerGrad)" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="90" y="21" text-anchor="middle" fill="#C9A96E" font-family="system-ui, sans-serif" font-size="13" font-weight="600">STEP 1 智能采集</text>

    <!-- Main card -->
    <rect x="0" y="36" width="180" height="200" rx="6" fill="#0f1f3a" stroke="#1e3a5f" stroke-width="0.5"/>

    <!-- Icon area -->
    <rect x="60" y="48" width="60" height="40" rx="4" fill="#1a2744" stroke="#2a4a6f" stroke-width="0.5"/>
    <!-- Spider/web icon -->
