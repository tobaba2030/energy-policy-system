  <!-- Corner decorations -->
  <rect x="36" y="8" width="3" height="12" fill="#C9A96E" opacity="0.5"/>
  <rect x="641" y="8" width="3" height="12" fill="#C9A96E" opacity="0.5"/>
</svg>