      <text x="8" y="12" fill="#C9A96E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">实时更新</text>
      <text x="8" y="23" fill="#6a7a98" font-family="system-ui, sans-serif" font-size="9">每日同步最新文献</text>
