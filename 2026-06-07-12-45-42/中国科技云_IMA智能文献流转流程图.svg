  </defs>

  <!-- Background -->
  <rect width="680" height="520" fill="#0a1628"/>

  <!-- Decorative top line -->
  <rect x="40" y="12" width="80" height="2" fill="#C9A96E" opacity="0.6"/>
  <rect x="130" y="12" width="20" height="2" fill="#C9A96E" opacity="0.3"/>

  <!-- Title Area -->
  <text x="340" y="48" text-anchor="middle" fill="#f0f4f8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">智能文献流转：</text>
  <text x="340" y="76" text-anchor="middle" fill="#C9A96E" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">从数据采集到知识沉淀</text>
  <text x="340" y="100" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, -apple-system, sans-serif" font-size="11">中国科技云学术智能体平台 → 腾讯IMA知识库，全流程自动化</text>

  <!-- ========== STAGE 1: 数据采集 ========== -->
  <g transform="translate(40, 120)">
