  <!-- Stat 1 -->
  <text x="80" y="365" text-anchor="middle" fill="#f0f4f8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">10万+</text>
  <text x="80" y="382" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, sans-serif" font-size="9">日处理文献量</text>

  <line x1="150" y1="355" x2="150" y2="395" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Stat 2 -->
  <text x="210" y="365" text-anchor="middle" fill="#f0f4f8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">95%</text>
  <text x="210" y="382" text-anchor="middle" fill="#7a8aa8" font-family="system-ui, sans-serif" font-size="9">元数据准确率</text>

  <line x1="280" y1="355" x2="280" y2="395" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- Stat 3 -->
