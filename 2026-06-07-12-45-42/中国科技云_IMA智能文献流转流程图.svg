    <g transform="translate(12, 144)">
      <rect x="0" y="0" width="156" height="28" rx="3" fill="#0a1628" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="8" y="12" fill="#C9A96E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AI 智能爬取</text>
      <text x="8" y="23" fill="#6a7a98" font-family="system-ui, sans-serif" font-size="9">自动识别、去重、分类</text>
